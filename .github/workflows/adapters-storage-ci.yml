# Integration tests for optional Tier-1 storage adapters (Docker services).
name: Adapters (storage)

on:
  push:
    paths:
      - "adapters-storage-py/**"
      # astrocyte-sqlite tests run against this checkout's astrocyte (editable).
      - "astrocyte-py/**"
      - ".github/workflows/adapters-storage-ci.yml"
  pull_request:
    paths:
      - "adapters-storage-py/**"
      - "astrocyte-py/**"
      - ".github/workflows/adapters-storage-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6333:6333
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpass
        ports:
          - 7687:7687
          - 7474:7474
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200 >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      ASTROCYTE_QDRANT_URL: http://localhost:6333
      ASTROCYTE_NEO4J_URI: bolt://localhost:7687
      ASTROCYTE_NEO4J_USER: neo4j
      ASTROCYTE_NEO4J_PASSWORD: testpass
      ASTROCYTE_ELASTICSEARCH_URL: http://localhost:9200

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Wait for Neo4j Bolt
        run: |
          for _ in $(seq 1 45); do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/7687' 2>/dev/null; then
              echo "neo4j bolt up"
              exit 0
            fi
            sleep 2
          done
          echo "neo4j bolt not reachable"
          exit 1

      - name: astrocyte-qdrant
        working-directory: adapters-storage-py/astrocyte-qdrant
        run: |
          uv sync --extra dev
          uv run pytest tests -v --override-ini="addopts="

      - name: astrocyte-neo4j
        working-directory: adapters-storage-py/astrocyte-neo4j
        run: |
          uv sync --extra dev
          uv run pytest tests -v --override-ini="addopts="

      - name: astrocyte-elasticsearch
        working-directory: adapters-storage-py/astrocyte-elasticsearch
        run: |
          uv sync --extra dev
          uv run pytest tests -v --override-ini="addopts="

  sqlite:
    # Zero-infrastructure store. Its parity suite runs identical randomised
    # operations against PostgresStore and fails on any divergence in results,
    # ordering, scores or errors — Postgres is the contract — so it needs a
    # pgvector service. Every other test runs on the SQLite file alone.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: parity
          POSTGRES_DB: parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Deliberately not DATABASE_URL: parity runs must never be pointed at a
      # real database by an ambient variable.
      ASTROCYTE_PARITY_PG_DSN: postgresql://postgres:parity@localhost:5432/parity
      ASTROCYTE_PARITY_SEEDS: "20"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: astrocyte-sqlite
        working-directory: adapters-storage-py/astrocyte-sqlite
        run: |
          uv sync --extra dev
          uv run pytest tests -v --override-ini="addopts="

  sqlite-cross-platform:
    # The local store runs on users' machines: macOS and Windows too. No
    # Postgres service there (service containers are Linux-only), so the
    # parity suite skips; it runs in the Linux job above.
    name: sqlite (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: astrocyte-sqlite
        working-directory: adapters-storage-py/astrocyte-sqlite
        run: |
          uv sync --extra dev
          uv run pytest tests -v --override-ini="addopts="

  # adapters-age removed in M9 (ADR-008): Apache AGE is no longer a supported
  # graph backend. The astrocyte-age package + its CI job + its publish workflow
  # were all deleted. See adapters-storage-py/astrocyte-postgres/migrations/016_drop_age.sql
  # and docs/_design/adr/adr-008-section-graph-replaces-age.md.
