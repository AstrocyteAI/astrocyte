# Build + test gate, then push the multi-arch astrocyte-gateway-py image to GHCR (version tag).
# The image is pushed by digest only, attested and scanned, and receives its
# version / latest tags last — so a failing vulnerability gate leaves the
# published tags untouched (v0.16.0's image was tagged before its scan failed).
# Each platform image is scanned on its own: Trivy given the multi-arch index
# scans only the runner's platform, which let arm64-only CVEs through.
# Gateway test gate lives in `gateway-publish-test-gate.yml` (shared with `ci.yml`).
#
# Invoked by `release.yml` after PyPI publishes (`publish.yml` → `publish-astrocyte-postgres.yml`).
# Image uses `Dockerfile.release` (astrocyte + astrocyte-postgres from PyPI at this tag’s version).
# Run by hand with `version` to rebuild a released version's image from the
# branch you dispatch on (e.g. after an image-only fix), without re-tagging.
name: Publish astrocyte-gateway-py image to GHCR

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to build (e.g. 0.17.0); empty = the dispatched tag"
        required: false
      tag_latest:
        description: "Also move :latest to this image"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  PYTHON_VERSION: "3.12"
  # Platforms to build; the scan job checks the pushed index has exactly these.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test-astrocyte-py:
    # Job `name` cannot use `env`; keep "3.12" in sync with env.PYTHON_VERSION above.
    name: astrocyte-py (Python 3.12)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test astrocyte-py
        working-directory: astrocyte-py
        run: uv sync --extra dev && uv run python -m pytest

  gateway-publish-test-gate:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/gateway-publish-test-gate.yml

  wait-for-pypi:
    name: Wait for PyPI availability
    needs:
      - test-astrocyte-py
      - gateway-publish-test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Version from tag
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Wait for astrocyte and astrocyte-postgres on PyPI
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Poll via pip download — checks the simple index, the same path pip uses
          # at Docker build time. The JSON API can return 200 before the simple index
          # propagates to all CDN nodes, so JSON-only checks are unreliable here.
          # --no-cache-dir: never answer from pip's own copy of the index page.
          # Up to 30 minutes: on v0.17.0 astrocyte-postgres was still missing from
          # the index 12 minutes after its upload.
          # astrocyte-age removed from the wait list in M9 (ADR-008).
          for pkg in astrocyte astrocyte-postgres; do
            echo "Waiting for ${pkg}==${VERSION} to be pip-downloadable..."
            for i in $(seq 1 180); do
              if pip download --no-cache-dir "${pkg}==${VERSION}" --no-deps -q -d /tmp/pypi-check; then
                echo "✓ ${pkg}==${VERSION} available"
                rm -rf /tmp/pypi-check
                break
              fi
              if [ "$i" = "180" ]; then
                echo "✗ ${pkg}==${VERSION} not available after ~30 minutes"
                exit 1
              fi
              echo "  Attempt ${i}/180 — ${pkg}==${VERSION} not yet available, retrying in 10s..."
              sleep 10
            done
          done

  build-and-push:
    name: Build and push image
    needs:
      - wait-for-pypi
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ steps.meta.outputs.repository_lc }}/astrocyte-gateway-py
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
      platform_images: ${{ steps.platforms.outputs.images }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag (for Docker build-args)
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          VERSION="${V#v}"
          TAG="v${VERSION}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            # OCI image names must be lowercase; bash 4+ (ubuntu-latest)
            echo "repository_lc=${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Untagged: scanning needs the image in the registry (multi-arch builds
      # can't be loaded locally), but nothing may point at it until it passes.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: astrocyte-services-py/astrocyte-gateway-py/Dockerfile.release
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=ghcr.io/${{ steps.meta.outputs.repository_lc }}/astrocyte-gateway-py,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            ASTROCYTE_VERSION=${{ steps.meta.outputs.version }}
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.meta.outputs.version }}

      - name: Attest image (SLSA provenance → GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repository_lc }}/astrocyte-gateway-py
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # One entry per platform image in the pushed index, for the scan and SBOM matrices.
      # Buildx's own attestation manifests (platform unknown/unknown) are skipped.
      - name: List per-platform images
        id: platforms
        env:
          IMAGE: ghcr.io/${{ steps.meta.outputs.repository_lc }}/astrocyte-gateway-py
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          images="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" | jq -c '
            [.manifests[] | select(.platform.os != "unknown")
             | (.platform | "\(.os)/\(.architecture)" + (if .variant then "/\(.variant)" else "" end)) as $p
             | {platform: $p, slug: ($p | gsub("/"; "-")), digest}]')"
          want="$(jq -cn --arg p "${PLATFORMS}" '$p | split(",") | sort')"
          got="$(jq -c '[.[].platform] | sort' <<<"${images}")"
          if [ "${want}" != "${got}" ]; then
            echo "::error::Pushed index has platforms ${got}, expected ${want}"
            exit 1
          fi
          echo "${images}" | jq .
          echo "images=${images}" >> "$GITHUB_OUTPUT"

  # Vulnerability scan, one job per platform image (by its own digest, so
  # Trivy can't resolve the index to just the runner's platform). SARIF always
  # uploads to the Security tab for visibility; the gate fails the release only
  # on FIXABLE CRITICAL/HIGH findings (ignore-unfixed) so a base-image CVE with
  # no patch yet does not block shipping.
  scan:
    name: Scan ${{ matrix.platform }}
    needs:
      - build-and-push
    permissions:
      contents: read
      packages: read
      security-events: write  # upload Trivy SARIF to the Security tab
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-and-push.outputs.platform_images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image (Trivy → SARIF)
        # SHA-pinned (GHSA-69fq-xp46-6x23: trivy-action version tags were hijacked)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image }}@${{ matrix.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image-${{ matrix.slug }}

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        # SHA-pinned (GHSA-69fq-xp46-6x23: trivy-action version tags were hijacked)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image }}@${{ matrix.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # Supply-chain: one SPDX SBOM per platform image, attested to that image's
  # own digest. Syft given the index resolves it to the runner's platform, so
  # v0.17.0's index carried an amd64-only SBOM and the arm64 image had none.
  # An SBOM describes one image's filesystem, so none is attached to the index
  # (cosign and BuildKit treat SBOMs as per-platform too); the index keeps the
  # build provenance. Consumers pick their platform:
  #   gh attestation verify oci://IMAGE@<platform digest> --repo OWNER/REPO \
  #     --predicate-type https://spdx.dev/Document/v2.3
  #   cosign download attestation --platform linux/arm64 \
  #     --predicate-type https://spdx.dev/Document/v2.3 IMAGE:TAG
  sbom:
    name: SBOM ${{ matrix.platform }}
    needs:
      - build-and-push
    permissions:
      contents: read
      packages: write  # push the attestation to GHCR
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build-and-push.outputs.platform_images) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.build-and-push.outputs.image }}@${{ matrix.digest }}
          # With credentials the action scans straight from the registry
          # (Syft's registry: source) instead of pulling a foreign-platform
          # image into the runner's Docker daemon.
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-${{ matrix.slug }}.spdx.json
          artifact-name: sbom-${{ matrix.slug }}.spdx.json

      # Never attest an SBOM to a digest it doesn't describe: Syft's root
      # package records the manifest it scanned and its architecture.
      - name: Check the SBOM describes this platform image
        env:
          SBOM: sbom-${{ matrix.slug }}.spdx.json
          DIGEST: ${{ matrix.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The root names the image by digest. Its purl's arch is empty when
          # Syft (1.42) scans a digest from the registry, so the architecture
          # comes from the Debian packages: every one not built for "all" must
          # be built for this platform.
          root="$(jq -c '[.packages[] | select(.primaryPackagePurpose == "CONTAINER") | .versionInfo]' "${SBOM}")"
          arches="$(jq -c '[.packages[].externalRefs[]? | select(.referenceType == "purl") | .referenceLocator
            | select(startswith("pkg:deb/")) | capture("[?&]arch=(?<a>[^&]+)").a | select(. != "all")]
            | unique' "${SBOM}")"
          want_root="$(jq -cn --arg d "${DIGEST}" '[$d]')"
          want_arches="$(jq -cn --arg p "${PLATFORM}" '[$p | split("/")[1]]')"
          if [ "${root}" != "${want_root}" ] || [ "${arches}" != "${want_arches}" ]; then
            echo "::error::${SBOM} describes ${root} with ${arches} packages, expected ${want_root} with ${want_arches}"
            exit 1
          fi
          echo "${SBOM}: $(jq '.packages | length' "${SBOM}") packages, ${PLATFORM} @ ${DIGEST}"

      - name: Attest SBOM (→ GHCR)
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ needs.build-and-push.outputs.image }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: sbom-${{ matrix.slug }}.spdx.json
          push-to-registry: true

  # Only a scanned, attested image gets the tags users pull — and only once
  # every platform's scan and SBOM passed. imagetools copies the multi-arch
  # index as is, so the digest (and its attestations) is exactly what was
  # scanned.
  tag:
    name: Tag the scanned image
    needs:
      - build-and-push
      - scan
      - sbom
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the scanned image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          # Unset (release.yml's call) means true.
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: |
          LATEST=(-t "${IMAGE}:latest")
          [ "${TAG_LATEST}" = "false" ] && LATEST=()
          docker buildx imagetools create -t "${IMAGE}:${TAG}" "${LATEST[@]}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
