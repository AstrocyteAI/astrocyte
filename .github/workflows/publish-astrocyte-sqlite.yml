# One workflow file per PyPI project — required for Trusted Publishing OIDC subject matching.
# Integration tests must pass before build/publish (same stack as adapters-storage-ci.yml sqlite job, including the PostgresStore parity suite).
name: Publish astrocyte-sqlite to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  test:
    name: Store + Postgres parity tests (SQLite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: parity
          POSTGRES_DB: parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ASTROCYTE_PARITY_PG_DSN: postgresql://postgres:parity@localhost:5432/parity
      ASTROCYTE_PARITY_SEEDS: "20"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run pytest (astrocyte-sqlite)
        working-directory: adapters-storage-py/astrocyte-sqlite
        run: |
          uv sync --extra dev
          uv run pytest tests -v --override-ini="addopts="

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pin version in pyproject.toml
        working-directory: adapters-storage-py/astrocyte-sqlite
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - name: Build package
        working-directory: adapters-storage-py/astrocyte-sqlite
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.ver.outputs.version }}
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-sqlite
          path: adapters-storage-py/astrocyte-sqlite/dist/

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-sqlite
          path: dist/

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/astrocyte_sqlite-*"

  publish:
    needs: attest
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-sqlite
          path: dist/

      - name: Check if version already exists on PyPI
        id: check
        env:
          REF_VERSION: ${{ github.ref_name }}
        run: |
          V="${REF_VERSION#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/astrocyte-sqlite/$V/json")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          attestations: false
