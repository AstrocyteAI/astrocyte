[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrocyte-aml-py"
version = "0.1.0"
description = "Agent Memory Leaderboard (AML) Add/Search adapter for Astrocyte"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "astrocyte",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.uv.sources]
# Resolve astrocyte from the local checkout, not PyPI. Without this, uv.lock
# pins the published wheel (0.15.1) and `uv run` re-syncs to it on every
# invocation — so the tests and the CI job silently validate a *released*
# astrocyte rather than the source under review. That defeats the shim's whole
# premise: providers added since the last release (claude_cli,
# local_embeddings, composite) are absent from the entry-point registry, and
# ASTROCYTE_SELFEVAL_PROVIDER=claude_cli fails with LookupError at runtime.
# Same pattern as the storage adapters.
astrocyte = { path = "../../astrocyte-py", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["astrocyte_aml", "aml_selfeval"]
