[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrocyte-aml-py"
version = "0.1.0"
description = "Agent Memory Leaderboard (AML) Add/Search adapter for Astrocyte"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "astrocyte",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["astrocyte_aml", "aml_selfeval"]
